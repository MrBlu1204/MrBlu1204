<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Recognition and Awards</title>
  <desc id="desc">A dark developer portfolio themed awards banner with violet gradients, glowing grid lines, trophy icon, and the words Achievements That Drive Excellence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070c"/>
      <stop offset="0.55" stop-color="#0b0715"/>
      <stop offset="1" stop-color="#14052b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <ellipse cx="920" cy="150" rx="220" ry="130" fill="url(#orb)" filter="url(#blur)"/>

  <g opacity="0.18" stroke="#a855f7" fill="none">
    <path d="M0 235 C180 205 290 265 460 232 S800 185 1200 220"/>
    <path d="M0 258 C180 228 320 283 500 250 S850 205 1200 240"/>
    <path d="M0 282 C210 252 330 300 520 274 S880 235 1200 268"/>
  </g>

  <g opacity="0.16" stroke="#8b5cf6">
    <path d="M730 0 V300 M790 0 V300 M850 0 V300 M910 0 V300 M970 0 V300 M1030 0 V300 M1090 0 V300"/>
    <path d="M720 70 H1200 M720 125 H1200 M720 180 H1200 M720 235 H1200"/>
  </g>

  <g transform="translate(915 60)">
    <circle cx="90" cy="90" r="86" fill="#0a0a12" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="90" cy="90" r="70" fill="none" stroke="#7c3aed" stroke-opacity="0.35"/>
    <path d="M55 45 H72 V88 C72 105 84 116 90 116 C96 116 108 105 108 88 V45 H125 V87 C125 116 109 132 99 137 V151 H119 V164 H61 V151 H81 V137 C71 132 55 116 55 87 Z" fill="url(#glow)"/>
    <path d="M55 51 H42 C32 51 27 58 31 69 C34 79 42 84 56 86" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>
    <path d="M125 51 H138 C148 51 153 58 149 69 C146 79 138 84 124 86" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>
    <path d="M63 174 H117" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="#c084fc">
    <circle cx="760" cy="48" r="2"/><circle cx="820" cy="238" r="2"/><circle cx="1065" cy="40" r="2"/><circle cx="1130" cy="205" r="2"/>
  </g>

  <text x="64" y="86" fill="#c084fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="3">RECOGNITION / AWARDS</text>
  <text x="64" y="138" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">Achievements That Drive</text>
  <text x="64" y="182" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">Excellence<span fill="#a855f7">.</span></text>
  <rect x="64" y="214" width="420" height="2" fill="url(#glow)"/>
  <text x="64" y="245" fill="#a1a1aa" font-family="Segoe UI,Arial,sans-serif" font-size="15">Recognitions earned through engineering impact, reliability and continuous growth.</text>
</svg>
