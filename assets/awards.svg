<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
<title id="t">Highflyer awards</title><desc id="d">Five Highflyer awards from 2021 to 2025.</desc>
<rect width="1200" height="220" rx="24" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="48" fill="#8be9fd" font-size="23" font-weight="700">RECOGNITION</text>
<text x="48" y="74" fill="#8fa8bd" font-size="14">5× Highflyer recognition across the career.</text>
<line x1="120" y1="142" x2="1080" y2="142" stroke="#3b536a" stroke-width="4"/>
<g fill="#f8fafc" text-anchor="middle">
<g><circle cx="150" cy="142" r="21" fill="#13283a"><animate attributeName="opacity" values=".6;1;.6" dur="2.5s" repeatCount="indefinite"/><text x="150" y="149" fill="#67e8f9" font-size="17">★</text></circle><text x="150" y="104" font-size="12">2021 · Q3</text><text x="150" y="184" fill="#a7bdcf" font-size="10">Star Team</text></g>
<g><circle cx="390" cy="142" r="21" fill="#13283a"><animate attributeName="opacity" values="1;.65;1" dur="2.2s" repeatCount="indefinite"/><text x="390" y="149" fill="#67e8f9" font-size="17">★</text></circle><text x="390" y="104" font-size="12">2021 · Annual</text><text x="390" y="184" fill="#a7bdcf" font-size="10">Team of the Year</text></g>
<g><circle cx="630" cy="142" r="21" fill="#13283a"><animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/><text x="630" y="149" fill="#67e8f9" font-size="17">★</text></circle><text x="630" y="104" font-size="12">2023 · H1</text><text x="630" y="184" fill="#a7bdcf" font-size="10">Award of Applause</text></g>
<g><circle cx="870" cy="142" r="21" fill="#13283a"><animate attributeName="opacity" values="1;.7;1" dur="2s" repeatCount="indefinite"/><text x="870" y="149" fill="#67e8f9" font-size="17">★</text></circle><text x="870" y="104" font-size="12">2024 · Q2</text><text x="870" y="184" fill="#a7bdcf" font-size="10">Award of Applause</text></g>
<g><circle cx="1080" cy="142" r="21" fill="#2b2450"><text x="1080" y="149" fill="#c4b5fd" font-size="17">★</text><circle cx="1080" cy="142" r="28" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 1080 142" to="360 1080 142" dur="8s" repeatCount="indefinite"/></circle></circle><text x="1080" y="104" font-size="12">2025 · Annual</text><text x="1080" y="184" fill="#a7bdcf" font-size="10">Highflyer Award</text></g>
</g></g></svg>
